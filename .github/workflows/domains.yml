name: Pages custom domains

# Registers a custom domain on the Pages project.
#
# This has to happen BEFORE DNS points at Pages. A CNAME aimed at a project
# that does not claim the hostname gets a Cloudflare error page, so flipping
# DNS first would take the site down until the domain was added.
#
# It lives in a workflow because the only token with Pages:Edit for this
# account is the CLOUDFLARE_API_TOKEN repo secret - the local DNS token,
# which can edit the zone, returns "Authentication error" against the Pages
# API.
#
# jq, not an embedded python heredoc: multi-line python inside a YAML block
# scalar has to sit at column 0 to run, and column 0 ends the block scalar.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Hostname to add (e.g. mlicanada.com or www.mlicanada.com)'
        required: true
      project:
        description: 'Pages project'
        required: true
        default: 'mlicanada-holding'
      action:
        description: 'add, delete or list'
        required: true
        default: 'add'
        type: choice
        options: [add, delete, list]

permissions: {}

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Add the custom domain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: ${{ inputs.domain }}
          ACTION: ${{ inputs.action }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -uo pipefail
          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required"
            exit 1
          fi
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains"
          AUTH="Authorization: Bearer $CF_TOKEN"

          echo "== domains already on $PROJECT =="
          curl -s -H "$AUTH" "$API" | jq -r '(.result // []) | if length == 0 then "   (none)" else .[] | "   \(.name)  \(.status)" end'

          if [ "$ACTION" = "list" ]; then exit 0; fi

          if [ "$ACTION" = "delete" ]; then
            echo
            echo "== deleting $DOMAIN =="
            D=$(curl -s -X DELETE -H "$AUTH" "$API/$DOMAIN")
            echo "   $(echo "$D" | jq -r 'if .success then "deleted" else ([.errors[]?.message] | join("; ")) end')"
            echo
            echo "== domains now =="
            curl -s -H "$AUTH" "$API" | jq -r '(.result // []) | if length == 0 then "   (none)" else .[] | "   \(.name)  \(.status)" end'
            exit 0
          fi

          echo
          echo "== adding $DOMAIN =="
          OUT=$(curl -s -X POST -H "$AUTH" -H 'content-type: application/json' --data "{\"name\":\"$DOMAIN\"}" "$API")
          OK=$(echo "$OUT" | jq -r '.success')
          if [ "$OK" = "true" ]; then
            echo "   added: $(echo "$OUT" | jq -r '.result.name')  status: $(echo "$OUT" | jq -r '.result.status')"
          else
            MSG=$(echo "$OUT" | jq -r '[.errors[]?.message] | join("; ")')
            # Already-present is not a failure: this workflow is safe to re-run.
            case "$MSG" in
              *already*|*Already*|*exist*|*Exist*) echo "   already present: $MSG" ;;
              *) echo "::error::could not add $DOMAIN: $MSG"; exit 1 ;;
            esac
          fi

          echo
          echo "== domains now =="
          curl -s -H "$AUTH" "$API" | jq -r '(.result // [])[] | "   \(.name)  \(.status)"'
